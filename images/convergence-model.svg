<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <radialGradient id="centerGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background decorative concentric rings -->
  <circle cx="320" cy="240" r="190" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="320" cy="240" r="120" fill="none" stroke="#DBEAFE" stroke-width="1.5" />

  <!-- Converging Dashed Lines to Center -->
  <line x1="190" y1="120" x2="270" y2="200" stroke="#818CF8" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="450" y1="120" x2="370" y2="200" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="190" y1="360" x2="270" y2="280" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="450" y1="360" x2="370" y2="280" stroke="#6366F1" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Quadrant 1: GROWTH (Top Left) -->
  <g transform="translate(190, 120)" filter="url(#shadow3)">
    <circle cx="0" cy="0" r="62" fill="#581C87" stroke="#9333EA" stroke-width="2" />
    <!-- Icon -->
    <path d="M-8 8 V-2 M-2 8 V-8 M4 8 V-14 M10 8 V-6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.06em">GROWTH</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="9" fill="#E9D5FF" text-anchor="middle">Market + Customer + Revenue</text>
  </g>

  <!-- Quadrant 2: ENGINEERING (Top Right) -->
  <g transform="translate(450, 120)" filter="url(#shadow3)">
    <circle cx="0" cy="0" r="62" fill="#1E3A8A" stroke="#2563EB" stroke-width="2" />
    <!-- Gear Icon -->
    <circle cx="0" cy="-6" r="6" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <path d="M-2 -15 H2 M-2 3 H2 M-9 -6 V-6 M9 -6 V-6" stroke="#FFFFFF" stroke-width="2" />
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.06em">ENGINEERING</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="9" fill="#BFDBFE" text-anchor="middle">Process + Product + Operations</text>
  </g>

  <!-- Quadrant 3: DIGITAL (Bottom Left) -->
  <g transform="translate(190, 360)" filter="url(#shadow3)">
    <circle cx="0" cy="0" r="62" fill="#0E7490" stroke="#06B6D4" stroke-width="2" />
    <!-- Network / Systems Icon -->
    <circle cx="-6" cy="-8" r="3" fill="#FFFFFF" />
    <circle cx="6" cy="-8" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="2" r="3" fill="#FFFFFF" />
    <line x1="-6" y1="-8" x2="0" y2="2" stroke="#FFFFFF" stroke-width="1.5" />
    <line x1="6" y1="-8" x2="0" y2="2" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.06em">DIGITAL</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="9" fill="#CFFAFE" text-anchor="middle">Systems + Data + Connectivity</text>
  </g>

  <!-- Quadrant 4: AI & AUTOMATION (Bottom Right) -->
  <g transform="translate(450, 360)" filter="url(#shadow3)">
    <circle cx="0" cy="0" r="62" fill="#312E81" stroke="#6366F1" stroke-width="2" />
    <!-- Brain / Neural Icon -->
    <circle cx="-4" cy="-8" r="2.5" fill="#FFFFFF" />
    <circle cx="4" cy="-8" r="2.5" fill="#FFFFFF" />
    <circle cx="-6" cy="0" r="2.5" fill="#FFFFFF" />
    <circle cx="6" cy="0" r="2.5" fill="#FFFFFF" />
    <path d="M-4 -8 L4 -8 M-6 0 L6 0 M-4 -8 L-6 0 M4 -8 L6 0" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.06em">AI</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="9" fill="#E0E7FF" text-anchor="middle">Automation + Intelligence + Decisions</text>
  </g>

  <!-- Center Hub: BUSINESS VALUE -->
  <g transform="translate(320, 240)" filter="url(#shadow3)">
    <circle cx="0" cy="0" r="68" fill="url(#centerGrad3)" stroke="#2563EB" stroke-width="3" />
    <!-- Upward Growth Arrow & Chart Icon -->
    <path d="M-10 4 L-3 -3 L3 1 L10 -6 M10 -6 H5 M10 -6 V-1" stroke="#2563EB" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="14" fill="#0B132B" text-anchor="middle" letter-spacing="0.08em">BUSINESS</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="14" fill="#2563EB" text-anchor="middle" letter-spacing="0.08em">VALUE</text>
  </g>
</svg>
