<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="100%" height="100%">
  <defs>
    <filter id="shadowCircle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="centerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3B82F6" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- Connecting Circular Track -->
  <circle cx="350" cy="270" r="175" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Connecting lines to Center -->
  <line x1="350" y1="270" x2="350" y2="95" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="350" y1="270" x2="516" y2="216" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="350" y1="270" x2="453" y2="412" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="350" y1="270" x2="247" y2="412" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="350" y1="270" x2="184" y2="216" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Center Hub: MEASURABLE BUSINESS OUTCOMES -->
  <g transform="translate(350, 270)" filter="url(#centerShadow)">
    <circle cx="0" cy="0" r="75" fill="url(#centerGrad)" stroke="#3B82F6" stroke-width="3" />
    <!-- Center Icon: Analytics / Compass -->
    <circle cx="0" cy="-24" r="16" fill="#EFF6FF" />
    <path d="M-8 -24 L-2 -30 L4 -26 L8 -32 M8 -32 H4 M8 -32 V-28" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="12" fill="#0F172A" text-anchor="middle" letter-spacing="0.08em">MEASURABLE</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="12" fill="#0F172A" text-anchor="middle" letter-spacing="0.08em">BUSINESS</text>
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="12" fill="#2563EB" text-anchor="middle" letter-spacing="0.08em">OUTCOMES</text>
  </g>

  <!-- Node 1: Top (MARKET) -->
  <g transform="translate(350, 95)">
    <circle cx="0" cy="0" r="34" fill="#0284C7" stroke="#FFFFFF" stroke-width="3" filter="url(#shadowCircle)" />
    <!-- Market Bar Chart Icon -->
    <path d="M-8 8 V0 M-2 8 V-6 M4 8 V-10 M10 8 V-4" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <g transform="translate(48, -12)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#0F172A" letter-spacing="0.05em">MARKET</text>
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569">Understand the market.</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569">Identify opportunities. Define where to play.</text>
    </g>
  </g>

  <!-- Node 2: Top Right (ENGINEERING) -->
  <g transform="translate(516, 216)">
    <circle cx="0" cy="0" r="34" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="3" filter="url(#shadowCircle)" />
    <!-- Helmet / Drafting Icon -->
    <path d="M-10 4 A10 10 0 0 1 10 4 Z M-12 4 H12" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    <g transform="translate(48, -10)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#0F172A" letter-spacing="0.05em">ENGINEERING</text>
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569">Improve engineering.</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569">Optimize designs &amp; processes.</text>
    </g>
  </g>

  <!-- Node 3: Bottom Right (OPERATIONS) -->
  <g transform="translate(453, 412)">
    <circle cx="0" cy="0" r="34" fill="#6366F1" stroke="#FFFFFF" stroke-width="3" filter="url(#shadowCircle)" />
    <!-- Operations Cog Icon -->
    <circle cx="0" cy="0" r="6" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <path d="M-2 -11 H2 M-2 11 H2 M-11 -2 V2 M11 -2 V2" stroke="#FFFFFF" stroke-width="2.5" />
    <g transform="translate(48, -10)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#0F172A" letter-spacing="0.05em">OPERATIONS</text>
      <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569">Streamline operations.</text>
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569">Improve efficiency &amp; reliability.</text>
    </g>
  </g>

  <!-- Node 4: Bottom Left (DIGITAL) -->
  <g transform="translate(247, 412)">
    <circle cx="0" cy="0" r="34" fill="#0284C7" stroke="#FFFFFF" stroke-width="3" filter="url(#shadowCircle)" />
    <!-- Digital Monitor Icon -->
    <rect x="-10" y="-8" width="20" height="13" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <line x1="-4" y1="8" x2="4" y2="8" stroke="#FFFFFF" stroke-width="2" />
    <g transform="translate(-180, -10)">
      <text x="130" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#0F172A" text-anchor="end" letter-spacing="0.05em">DIGITAL</text>
      <text x="130" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569" text-anchor="end">Digitize and connect.</text>
      <text x="130" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569" text-anchor="end">Build systems &amp; data visibility.</text>
    </g>
  </g>

  <!-- Node 5: Top Left (AI & AUTOMATION) -->
  <g transform="translate(184, 216)">
    <circle cx="0" cy="0" r="34" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3" filter="url(#shadowCircle)" />
    <!-- Brain / AI Chip Icon -->
    <rect x="-8" y="-8" width="16" height="16" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <line x1="-12" y1="-3" x2="-8" y2="-3" stroke="#FFFFFF" stroke-width="2" />
    <line x1="-12" y1="3" x2="-8" y2="3" stroke="#FFFFFF" stroke-width="2" />
    <line x1="8" y1="-3" x2="12" y2="-3" stroke="#FFFFFF" stroke-width="2" />
    <line x1="8" y1="3" x2="12" y2="3" stroke="#FFFFFF" stroke-width="2" />
    <g transform="translate(-210, -10)">
      <text x="160" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="14" fill="#0F172A" text-anchor="end" letter-spacing="0.05em">AI &amp; AUTOMATION</text>
      <text x="160" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569" text-anchor="end">Automate intelligently.</text>
      <text x="160" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="11" fill="#475569" text-anchor="end">Augment people &amp; decisions.</text>
    </g>
  </g>
</svg>
